name: Build & Publish dbt Docs + Colibri (Offline, DuckDB w/ synthetic catalog)

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Explicit profiles dir; we pass it on EVERY dbt call
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      # -----------------------------
      # 1) Checkout + Python tools
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (dbt-duckdb, colibri, duckdb runtime, yaml)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "dbt-duckdb==1.7.*" dbt-colibri duckdb pyyaml

      # -----------------------------
      # 2) Write a DuckDB-only dbt profile (offline)
      # -----------------------------
      - name: Write CI profiles.yml (DuckDB; offline)
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" << 'YAML'
          ci_profile:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ./ci.duckdb
                schema: analytics     # logical schema for compiled models
                threads: 4
          YAML
          echo "WROTE profiles to: $DBT_PROFILES_DIR"
          ls -la "$DBT_PROFILES_DIR" || true
          echo "------ profiles.yml ------"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      # -----------------------------
      # 3) (Optional) dbt deps
      # -----------------------------
      - name: Install dbt packages (conditional)
        if: ${{ hashFiles('packages.yml') != '' }}
        run: |
          dbt deps \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

      # -----------------------------
      # 4) Build manifest (offline parse + compile)
      # -----------------------------
      - name: Build dbt manifest (offline parse + compile)
        run: |
          set -e
          dbt parse \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          dbt compile \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci



      # -----------------------------
      # 7) Generate dbt Docs WITH catalog (no --empty-catalog)
      #    This introspects the local DuckDB empty tables and writes target/catalog.json (with columns).
      # -----------------------------
      - name: Generate dbt Docs (WITH catalog from local DuckDB)
        run: dbt docs generate --static --profiles-dir "$DBT_PROFILES_DIR" --profile ci_profile  --target ci

      - name: Prepare static site (dbt docs only)
        run: 2
          mkdir -p site
          cp -R target/* site/   
      - name: Prepare versioned folder path
        run: |
          VERSION=$(date +%Y-%m-%d_%H-%M-%S)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          
      - name:  Commit versioned docs back to repo
        if: ${{ always() }}
        run: mkdir -p "docs/$VERSION"
          cp -rf dist/*.html "docs/$VERSION"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/
          git commit -m "Add dbt/dbt docs for $VERSION" || echo "No changes to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "No changes pushed"

      # -----------------------------
      # 9) Configure + Upload to GitHub Pages
      # -----------------------------
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (combined)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
