name: Publish Colibri Lineage (Offline, DuckDB)

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Explicit profiles dir; we pass it on EVERY dbt call
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt + colibri (DuckDB only; offline)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "dbt-duckdb==1.7.*" dbt-colibri

      - name: Write CI profiles.yml (DuckDB)
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" << 'YAML'
          ci_profile:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ./ci.duckdb
                schema: analytics
                threads: 4
          YAML
          echo "WROTE profiles to: $DBT_PROFILES_DIR"
          ls -la "$DBT_PROFILES_DIR" || true
          echo "------ profiles.yml ------"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      - name: Build dbt manifest (offline parse + compile)
        run: |
          set -e
          echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
          test -f "$DBT_PROFILES_DIR/profiles.yml" || { echo "profiles.yml missing"; exit 2; }

          # Offline graph build; no warehouse is contacted
          dbt parse \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          dbt compile \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          # Sanity check: manifest must exist
          test -f target/manifest.json || (echo "target/manifest.json missing after compile" && exit 3)

      - name: Generate Colibri lineage
        run: |
          set -e
          rm -rf dist
          mkdir -p dist

          colibri generate \
            --manifest target/manifest.json \
            --output-dir dist/

          echo "Colibri output listing:"
          ls -la dist || true

          # Fail loudly if nothing was produced
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "ERROR: colibri produced no output in dist/. Failing the build."
            exit 4
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (Colibri only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
