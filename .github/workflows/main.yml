name: Build & Publish dbt Docs to GitHub Pages

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dbt + colibri (DuckDB)
        run: |
          pip install "dbt-duckdb==1.7.*"
          pip install dbt-colibri

      - name: Write dbt profiles.yml
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" << 'YAML'
          ci_profile:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ./ci.duckdb
                schema: analytics
                threads: 4
          YAML
          echo "Wrote $DBT_PROFILES_DIR/profiles.yml:"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      - name: Install dbt packages (conditional)
        if: ${{ hashFiles('packages.yml') != '' }}
        run: dbt deps --profiles-dir "$DBT_PROFILES_DIR" --profile ci_profile --target ci  # ⬅️ CHANGED (explicit --profiles-dir)

      - name: Compile & Generate dbt docs
        run: |
          test -f "$DBT_PROFILES_DIR/profiles.yml" || { echo "profiles.yml missing in $DBT_PROFILES_DIR"; exit 2; }

          dbt compile \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          dbt docs generate \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci \
            --static
          # dbt docs behavior & --static semantics are as documented (may still reference JSON depending on version). [2](https://docs.getdbt.com/docs/core/connect-data-platform/mssql-setup)[3](https://github.com/dbt-msft/dbt-sqlserver)

      - name: Verify docs output
        run: |
          test -f target/index.html || (echo "target/index.html is missing" && exit 1)
          echo "Docs generated. Listing target/:"
          ls -la target | head -n 100

      - name: Prepare static site (dbt docs only)
        run: |
          mkdir -p site
          cp -R target/* site/
          # ⬇️ REMOVED the premature 'colibri generate' here (it was overwriting dist) ⬅️ CHANGED

      - name: Prepare versioned folder path
        run: |
          VERSION=$(date +%Y-%m-%d_%H-%M-%S)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Patch manifest for Colibri (Python script)
        run: python scripts/Patch_docs_manifest_for_Colibri.py
        # Ensure this script writes: target/manifest.patched.json

      - name: Generate Colibri Lineage (single, authoritative run)
        run: colibri generate --manifest target/manifest.patched.json --catalog target/catalog.json --output-dir dist/  # ⬅️ CHANGED (only run once)
        # Colibri reads dbt artifacts & writes standalone index.html to output dir. [1](https://pypi.org/project/dbt-fabricspark/)

      - name: (Optional) Commit versioned docs back to repo
        if: ${{ always() }}
        run: |
          mkdir -p docs/"$VERSION"
          # Fix dbt docs filename: it's 'index.html', not 'static_index.html' ⬅️ CHANGED
          cp -f target/index.html docs/"$VERSION"/dbt_index.html
          cp -rf dist/* docs/"$VERSION"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/
          git commit -m "Add dbt/colibri docs for $VERSION" || echo "No changes to commit"
          git push || echo "No changes pushed"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/   # ⬅️ Unchanged, but now 'dist/' is created by the single, correct Colibri run
          # If you also want dbt docs on Pages, switch this to 'site/' or publish both via a parent dir. [4](https://docs.github.com/en/enterprise-cloud@latest/pages/getting-started-with-github-pages/changing-the-visibility-of-your-github-pages-site)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
