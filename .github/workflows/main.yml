name: Build & Publish dbt Docs + Colibri (Offline, DuckDB w/ synthetic catalog)

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Explicit profiles dir; we pass it on EVERY dbt call
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      # -----------------------------
      # 1) Checkout + Python tools
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (dbt-duckdb, colibri, duckdb runtime, yaml)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "dbt-duckdb==1.7.*" dbt-colibri duckdb pyyaml

      # -----------------------------
      # 2) Write a DuckDB-only dbt profile (offline)
      # -----------------------------
      - name: Write CI profiles.yml (DuckDB; offline)
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" << 'YAML'
          ci_profile:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ./ci.duckdb
                schema: analytics     # logical schema for compiled models
                threads: 4
          YAML
          echo "WROTE profiles to: $DBT_PROFILES_DIR"
          ls -la "$DBT_PROFILES_DIR" || true
          echo "------ profiles.yml ------"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      # -----------------------------
      # 3) (Optional) dbt deps
      # -----------------------------
      - name: Install dbt packages (conditional)
        if: ${{ hashFiles('packages.yml') != '' }}
        run: |
          dbt deps \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

      # -----------------------------
      # 4) Build manifest (offline parse + compile)
      # -----------------------------
      - name: Build dbt manifest (offline parse + compile)
        run: |
          set -e
          dbt parse \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          dbt compile \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          test -f target/manifest.json || (echo "target/manifest.json missing after compile" && exit 3)


      # -----------------------------
      # 6) Generate Colibri lineage using manifest + catalog
      # -----------------------------
      - name: Generate Colibri lineage (manifest + catalog)
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          colibri generate --manifest target/manifest.json --catalog target/catalog.json --output-dir dist/
          echo "Colibri output listing:"
          ls -la dist || true
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "ERROR: Colibri produced no output in dist/. Failing the build."
            exit 7
          fi

      # -----------------------------
      # 7) Generate dbt Docs WITH catalog (no --empty-catalog)
      #    This introspects the local DuckDB empty tables and writes target/catalog.json (with columns).
      # -----------------------------
      - name: Generate dbt Docs (WITH catalog from local DuckDB)
        run: |
          set -e
          dbt docs generate \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci
            --static
          test -f target/catalog.json || (echo "ERROR: target/catalog.json missing" && exit 6)
          test -f target/index.html  || (echo "ERROR: target/index.html missing" && exit 6)

      # -----------------------------
      # 8) Assemble combined static site for GitHub Pages
      # -----------------------------
      - name: Assemble combined site (dbt + colibri)
        run: |
          set -e
          rm -rf public
          mkdir -p public/dbt public/colibri
          cp -R target/* public/dbt/
          cp -R dist/* public/colibri/
          # Simple landing page
          cat > public/index.html << 'HTML'
          <!doctype html><html lang="en"><head>
            <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
            <title>Documentation</title>
            <style>
              body{font-family:Arial,Helvetica,sans-serif;margin:40px;line-height:1.6}
              a{color:#0366d6;text-decoration:none}a:hover{text-decoration:underline}
              ul{margin-left:0;padding-left:18px}
            </style>
          </head><body>
            <h1>Project Documentation</h1>
            <ul>
              <li><a href="dbt/index.html">dbt Docs</a></li>
              <li><a href="colibri/index.html">Colibri Column Lineage</a></li>
            </ul>
          </body></html>
          HTML
          echo "Combined site structure:"
          find public -maxdepth 2 -type d -print


      - name: Prepare versioned folder path
        run: |
          VERSION=$(date +%Y-%m-%d_%H-%M-%S)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          
      - name:  Commit versioned docs back to repo
        if: ${{ always() }}
        run: |
          set -e
          mkdir -p "docs/$VERSION"

          # Copy dbt docs if present (non-fatal if missing)
          if [ -f target/index.html ]; then
            cp -f target/index.html "docs/$VERSION/dbt_index.html"
          else
            echo "WARN: target/index.html not found; skipping dbt docs copy"
          fi

          # Copy Colibri output (guaranteed to exist due to the guard above)
          cp -rf dist/* "docs/$VERSION"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/
          git commit -m "Add dbt/colibri docs for $VERSION" || echo "No changes to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "No changes pushed"

      # -----------------------------
      # 9) Configure + Upload to GitHub Pages
      # -----------------------------
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (combined)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
