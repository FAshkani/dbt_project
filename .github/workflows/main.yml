name: Build & Publish dbt Docs + Colibri Lineage

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Let dbt know where profiles.yml lives
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt + Colibri (DuckDB)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "dbt-duckdb==1.7.*" dbt-colibri

      - name: Write dbt profiles.yml
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" << 'YAML'
          ci_profile:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ./ci.duckdb
                schema: analytics
                threads: 4
          YAML
          echo "profiles.yml:"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      - name: Install dbt packages (optional)
        if: ${{ hashFiles('packages.yml') != '' }}
        run: dbt deps --profiles-dir "$DBT_PROFILES_DIR" --profile ci_profile --target ci

      - name: Compile & Generate dbt docs
        run: |
          dbt compile --profiles-dir "$DBT_PROFILES_DIR" --profile ci_profile --target ci
          dbt docs generate --static --profiles-dir "$DBT_PROFILES_DIR" --profile ci_profile --target ci

      - name: Verify docs output
        run: |
          ls -la target | head -n 100
          test -f target/index.html || (echo "dbt docs did not produce target/index.html" && exit 1)

      - name: Create site folder for GitHub Pages
        run: |
          mkdir -p site
          cp -R target/* site/

      - name: Generate Colibri lineage (standalone HTML)
        run: |
          # DuckDB does NOT require manifest patching
          mkdir -p dist
          colibri generate --manifest target/manifest.json --catalog target/catalog.json --output-dir dist/
          # Publish only static HTML (ignoring JSON artifact)
          mkdir -p site/colibri
          cp dist/index.html site/colibri/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
