name: Build & Publish dbt Docs + Colibri to GitHub Pages

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Explicit profiles dir; we pass it on EVERY dbt call
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dbt + colibri (SQL Server)
        run: |
          pip install "dbt-sqlserver==1.7.*"
          pip install dbt-colibri

      - name: Write dbt profiles.yml (sqlserver; no real DB required)
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" << 'YAML'
          ci_profile:
            target: ci
            outputs:
              ci:
                type: sqlserver
                driver: "ODBC Driver 18 for SQL Server"  # required by adapter schema
                host: localhost        # placeholder - not used
                database: dummy_db     # placeholder - not used
                schema: analytics
                user: dummy_user       # placeholder - not used
                password: dummy_pwd    # placeholder - not used
                trust_cert: true
                port: 1433
                threads: 4
          YAML
          echo "WROTE profiles to: $DBT_PROFILES_DIR"
          ls -la "$DBT_PROFILES_DIR" || true
          echo "------ profiles.yml ------"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      - name: Install dbt packages (conditional)
        if: ${{ hashFiles('packages.yml') != '' }}
        run: |
          dbt deps \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

      - name: Parse, Compile & Generate dbt docs (NO DB connections)
        run: |
          set -e
          echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
          ls -la "$DBT_PROFILES_DIR" || true
          test -f "$DBT_PROFILES_DIR/profiles.yml" || { echo "profiles.yml missing in $DBT_PROFILES_DIR"; exit 2; }

          # Pure graph build; no warehouse required
          dbt parse \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          dbt compile \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci

          # --empty-catalog skips metadata queries; --static emits single-page-friendly docs
          dbt docs generate \
            --profiles-dir "$DBT_PROFILES_DIR" \
            --profile ci_profile \
            --target ci \
            --empty-catalog \
            --static

      - name: Verify dbt docs output
        run: |
          test -f target/index.html || (echo "target/index.html is missing" && exit 1)
          echo "Docs generated. Listing target/:"
          ls -la target | head -n 100

      - name: Prepare static site (dbt docs only)
        run: |
          mkdir -p site
          cp -R target/* site/

      - name: Prepare versioned folder path
        run: |
          VERSION=$(date +%Y-%m-%d_%H-%M-%S)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # === Option 2 behavior: fail loudly if Colibri produced nothing ===
      - name: Generate Colibri Lineage (uses sqlserver manifest)
        run: |
          set -e

          # Clean + ensure output dir exists
          rm -rf dist
          mkdir -p dist

          if [ -f target/catalog.json ]; then
            echo "Running colibri with manifest + catalog..."
            colibri generate --manifest target/manifest.json --catalog target/catalog.json --output-dir dist/
          else
            echo "No catalog.json found; generating lineage from manifest only."
            colibri generate --manifest target/manifest.json --output-dir dist/
          fi

          echo "Colibri output listing:"
          ls -la dist || true

          # Hard-fail if dist is missing or empty
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "ERROR: colibri produced no output in dist/. Failing the build."
            exit 3
          fi

      - name: Prepare combined site (dbt + colibri)
        run: |
          mkdir -p public/dbt public/colibri
          cp -R site/* public/dbt/
          cp -R dist/* public/colibri/
          # Minimal landing page that links to both sections
          cat > public/index.html << 'HTML'
          <!doctype html><html lang="en"><head>
          <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>Documentation</title>
          <style>body{font-family:Arial,Helvetica,sans-serif;margin:40px;line-height:1.5}a{color:#0366d6;text-decoration:none}a:hover{text-decoration:underline}</style>
          </head><body>
          <h1>Documentation</h1>
          <ul>
            <li><a href="dbt/index.html">dbt Docs (latest)</a></li>
            <li><a href="colibri/index.html">Colibri Column Lineage</a></li>
          </ul>
          </body></html>
          HTML
          echo "Combined site structure:"
          find public -maxdepth 2 -type d -print

      - name: (Optional) Commit versioned docs back to repo
        if: ${{ always() }}
        run: |
          set -e
          mkdir -p "docs/$VERSION"

          # Copy dbt docs if present (non-fatal if missing)
          if [ -f target/index.html ]; then
            cp -f target/index.html "docs/$VERSION/dbt_index.html"
          else
            echo "WARN: target/index.html not found; skipping dbt docs copy"
          fi

          # Copy Colibri output (guaranteed to exist due to the guard above)
          cp -rf dist/* "docs/$VERSION"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/
          git commit -m "Add dbt/colibri docs for $VERSION" || echo "No changes to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "No changes pushed"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (combined)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
